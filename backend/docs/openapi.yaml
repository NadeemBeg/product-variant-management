openapi: 3.0.3
info:
  title: Product Variant Management System API
  version: 1.0.0
  description: >
    Seller + buyer API for products with multiple variants. Seller routes require
    a bearer token (stubbed: `tok_seller_amara`, `tok_seller_rafi`). Identity is
    always derived from the token, never the request body.
servers:
  - url: http://localhost:4000
tags:
  - name: Buyer
  - name: Seller
  - name: Uploads

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Image:
      type: object
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        alt: { type: string }
    Variant:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        price: { type: number }
        currency: { type: string }
        stock: { type: integer }
        available: { type: boolean }
        purchasable: { type: boolean }
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }
    Option:
      type: object
      properties:
        name: { type: string }
        values:
          type: array
          items: { type: string }
    Product:
      type: object
      properties:
        id: { type: string }
        sellerId: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        status: { type: string, enum: [draft, published] }
        options:
          type: array
          items: { $ref: "#/components/schemas/Option" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        priceRange:
          nullable: true
          type: object
          properties:
            min: { type: number }
            max: { type: number }
        inStock: { type: boolean }
        version: { type: integer }
    VariantInput:
      type: object
      required: [sku, attributes, price, stock]
      properties:
        sku: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        available: { type: boolean }
        currency: { type: string }
        images:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              alt: { type: string }
    CreateProduct:
      type: object
      required: [title, category, options, variants]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        status: { type: string, enum: [draft, published] }
        options:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Option" }
        variants:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/VariantInput" }
    Paginated:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        pagination:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }
            pages: { type: integer }

  responses:
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Validation error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflict (duplicate / insufficient stock / version)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing/invalid token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

paths:
  /api/products:
    get:
      tags: [Buyer]
      summary: List published products
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Paginated" } } }
  /api/products/{productId}:
    get:
      tags: [Buyer]
      summary: Published product detail
      parameters: [{ in: path, name: productId, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/products/{productId}/variants/{variantId}/purchase:
    post:
      tags: [Buyer]
      summary: Purchase a variant (atomic stock decrement)
      parameters:
        - { in: path, name: productId, required: true, schema: { type: string } }
        - { in: path, name: variantId, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { qty: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200": { description: Updated product, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/seller/products:
    get:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: List the signed-in seller's products
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Paginated" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Create a product with variants
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateProduct" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/seller/products/{productId}:
    parameters: [{ in: path, name: productId, required: true, schema: { type: string } }]
    get:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Get own product
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Update scalar fields (title/description/category/status)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                category: { type: string }
                status: { type: string, enum: [draft, published] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Delete own product
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/seller/products/{productId}/variants:
    post:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Add a variant
      parameters: [{ in: path, name: productId, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VariantInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/seller/products/{productId}/variants/{variantId}:
    parameters:
      - { in: path, name: productId, required: true, schema: { type: string } }
      - { in: path, name: variantId, required: true, schema: { type: string } }
    patch:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Update a variant (price/available/sku/attributes/currency)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Remove a variant
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/seller/products/{productId}/variants/{variantId}/stock:
    patch:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Adjust stock atomically (set OR delta)
      parameters:
        - { in: path, name: productId, required: true, schema: { type: string } }
        - { in: path, name: variantId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                set: { type: integer, minimum: 0 }
                delta: { type: integer }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/seller/products/{productId}/variants/{variantId}/images:
    post:
      tags: [Seller]
      security: [{ bearerAuth: [] }]
      summary: Attach an image to a variant
      parameters:
        - { in: path, name: productId, required: true, schema: { type: string } }
        - { in: path, name: variantId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                alt: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }

  /api/uploads:
    post:
      tags: [Uploads]
      security: [{ bearerAuth: [] }]
      summary: Upload an image file
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  bytes: { type: integer }
                  mime: { type: string }
